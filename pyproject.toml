[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-folder-compare"
version = "0.1.0"
description = "Compare a public Google Drive folder with a local folder and report missing files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
drive-folder-compare = "drive_folder_compare.cli:main"
drive-folder-compare-gui = "drive_folder_compare.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
